name: Base44 snapshot sync

on:
  push:
    paths:
      - '.sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild repository from Base44 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/part-* > /tmp/krosz-head.b64
          base64 -d /tmp/krosz-head.b64 > /tmp/krosz-head.tar.gz
          rm -rf /tmp/base44-snapshot
          mkdir -p /tmp/base44-snapshot
          tar -xzf /tmp/krosz-head.tar.gz -C /tmp/base44-snapshot
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/base44-snapshot/. .
          git config user.name "Base44 Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "Sync Base44 snapshot b975970"
          git push origin HEAD:main
